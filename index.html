<!DOCTYPE html>
<html>
<head>
  <title>Stylish Schedule Assignment</title>

  <style>
    table {
      width: 80%;
      margin: 30px auto;
      border-collapse: collapse;
      background-color: #f8fbff;
      border: 3px solid #4b6cb7;
      font-family: Arial, sans-serif;
    }

    th {
      background-color: #4b6cb7;
      color: white;
      font-size: 20px;
      padding: 12px;
    }

    td {
      border: 1px solid #9bb3d9;
      padding: 12px;
      text-align: center;
      font-size: 16px;
    }

    tr:nth-child(even) {
      background-color: #eaf2ff;
    }

    .time-column {
      font-weight: bold;
      color: #2f4f8f;
      background-color: #dbe6ff;
      width: 25%;
    }

    #important-row {
      background-color: #fff3cd;
    }

    h1 {
      text-align: center;
      color: #2f4f8f;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <!-- Beginning of schedule assignment -->

  <h1>My Busy Day Schedule</h1>

  <table>
    <tr>
      <th>Time</th>
      <th>Activity</th>
    </tr>

    <tr>
      <td class="time-column">7:30 AM</td>
      <td>Wake up and get ready</td>
    </tr>

    <tr>
      <td class="time-column">8:00 AM</td>
      <td>Eat breakfast</td>
    </tr>

    <tr>
      <td class="time-column">9:00 AM</td>
      <td>Study math</td>
    </tr>

    <tr>
      <td class="time-column">10:30 AM</td>
      <td>Horse riding practice</td>
    </tr>

    <tr id="important-row">
      <td class="time-column">12:30 PM</td>
      <td>Lunch break</td>
    </tr>

    <tr>
      <td class="time-column">2:00 PM</td>
      <td>English lesson</td>
    </tr>

    <tr>
      <td class="time-column">4:00 PM</td>
      <td>Work on school assignments</td>
    </tr>

    <tr>
      <td class="time-column">6:00 PM</td>
      <td>Practice piano</td>
    </tr>

    <tr>
      <td class="time-column">8:00 PM</td>
      <td>Dinner &amp; Free Time</td>
    </tr>
  </table>

  <!-- End of schedule assignment -->

</body>
</html>
